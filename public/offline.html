<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0f" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; navigate-to 'self'"
    />
    <title>ThyncSpace is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b0f;
        color: #eef2f7;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 30rem);
        padding: 2rem;
        background: #101319;
        border: 1px solid #39414e;
        border-radius: 0.75rem;
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.35);
      }

      img {
        width: 4rem;
        height: 4rem;
      }

      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #aab3c1;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 0.4rem;
        background: #7dd3fc;
        color: #090b0f;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>
        ThyncSpace does not cache your notes or account data on this device. Reconnect to load and edit your workspace.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
