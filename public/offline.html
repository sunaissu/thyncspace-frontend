<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color-meta" name="theme-color" content="#0a0a0b" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; navigate-to 'self'"
    />
    <title>ThyncSpace is offline</title>
    <script src="/theme-init.js"></script>
    <style>
      :root {
        color-scheme: light;
        --offline-bg: #f6f6f7;
        --offline-surface: #ffffff;
        --offline-border: #d4d4d8;
        --offline-text: #18181b;
        --offline-muted: #5f5f68;
        --offline-shadow: rgba(24, 24, 27, 0.14);
        --offline-accent: #0b63e5;
        --offline-on-accent: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--offline-bg);
        color: var(--offline-text);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --offline-bg: #0a0a0b;
        --offline-surface: #111113;
        --offline-border: #4b4b55;
        --offline-text: #fafafa;
        --offline-muted: #b4b4bd;
        --offline-shadow: rgba(0, 0, 0, 0.35);
      }

      html[data-accent="violet"] {
        --offline-accent: #6d28d9;
      }

      html[data-accent="emerald"] {
        --offline-accent: #047857;
      }

      html[data-accent="amber"] {
        --offline-accent: #92400e;
      }

      html[data-accent="rose"] {
        --offline-accent: #be123c;
      }

      html[data-theme="dark"][data-accent="blue"] {
        --offline-accent: #60a5fa;
        --offline-on-accent: #0a0a0b;
      }

      html[data-theme="dark"][data-accent="violet"] {
        --offline-accent: #a78bfa;
        --offline-on-accent: #0a0a0b;
      }

      html[data-theme="dark"][data-accent="emerald"] {
        --offline-accent: #6ee7b7;
        --offline-on-accent: #0a0a0b;
      }

      html[data-theme="dark"][data-accent="amber"] {
        --offline-accent: #fbbf24;
        --offline-on-accent: #0a0a0b;
      }

      html[data-theme="dark"][data-accent="rose"] {
        --offline-accent: #fb7185;
        --offline-on-accent: #0a0a0b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: var(--offline-bg);
      }

      main {
        width: min(100%, 30rem);
        padding: 2rem;
        background: var(--offline-surface);
        border: 1px solid var(--offline-border);
        border-radius: 0.75rem;
        box-shadow: 8px 8px 0 var(--offline-shadow);
      }

      img {
        width: 4rem;
        height: 4rem;
      }

      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--offline-muted);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.75rem 1rem;
        border-radius: 0.4rem;
        background: var(--offline-accent);
        color: var(--offline-on-accent);
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>
        ThyncSpace does not cache your notes or account data on this device. Reconnect to load and edit your workspace.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
